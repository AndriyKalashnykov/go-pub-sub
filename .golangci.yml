linters:
  default: all
  disable:
    - exhaustruct
    - depguard
    - ireturn
    - wrapcheck
    - godox
    - err113
    - varnamelen
    - testpackage
    - paralleltest
    - nonamedreturns
    - exhaustive
    - lll
    - funlen
    - gochecknoglobals
    - cyclop
    - wsl
    - nlreturn
    - gomnd
    - mnd

  settings:
    stylecheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"

    revive:
      rules:
        - name: exported
          disabled: true

issues:
  fix: true
